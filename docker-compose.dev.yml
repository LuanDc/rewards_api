services:
  postgres_db:
    image: postgres:18.1
    container_name: postgres_db
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - bsystem_network

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - bsystem_network

  debezium:
    image: quay.io/debezium/server:2.7
    container_name: debezium_server
    depends_on:
      - postgres_db
      - rabbitmq
    volumes:
      - ./infra/cdc/debezium/conf:/debezium/conf
      - debezium_data:/debezium/data
    networks:
      - bsystem_network

volumes:
  hex-cache:
  mix-cache:
  build-cache:
  deps-cache:
  pgdata:
  rabbitmq_data:
  debezium_data:

networks:
  bsystem_network:
